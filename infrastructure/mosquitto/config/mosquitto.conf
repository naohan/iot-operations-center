# Mosquitto — broker MQTT (Etapa 1)
# Listener TCP estándar (dispositivos / simulador / consumer)
listener 1883
protocol mqtt

# WebSockets (útil más adelante para debug desde el navegador)
listener 9001
protocol websockets

# Desarrollo local: sin auth. En producción se habilita.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
