services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./infrastructure/mosquitto/data:/mosquitto/data
      - ./infrastructure/mosquitto/log:/mosquitto/log
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: iot-postgres
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot_secret
      POSTGRES_DB: iot_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    container_name: iot-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg2://iot:iot_secret@postgres:5432/iot_ops
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_EVENTS_TOPIC: iot/events/#
      CORS_ORIGINS: http://localhost:4200,http://localhost:8000,http://localhost,http://localhost:80
      JWT_SECRET: change-me-iot-ops-dev-secret
      JWT_EXPIRE_MINUTES: "480"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  ingestion:
    build: ./backend
    container_name: iot-ingestion
    command: python -m ingestion.mqtt_consumer
    environment:
      DATABASE_URL: postgresql+psycopg2://iot:iot_secret@postgres:5432/iot_ops
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TELEMETRY_TOPIC: iot/devices/+/telemetry
      MQTT_STATUS_TOPIC: iot/devices/+/status
      TEMP_ALERT_THRESHOLD: "40.0"
      ML_ENABLED: "true"
      ML_MIN_SAMPLES: "25"
      ML_CONTAMINATION: "0.02"
      ML_TRAIN_WINDOW: "200"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: iot-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
